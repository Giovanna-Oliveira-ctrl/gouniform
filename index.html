<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoUniform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --brand:#E8461F;--brand-h:#C43A18;--brand-l:#FFF0EB;--brand-m:#FCDDD5;
  --bg:#F6F4F1;--surf:#fff;--surf2:#FAFAF8;
  --sb:#16110C;--sb-hv:rgba(255,255,255,.06);--sb-ac:rgba(232,70,31,.14);--sb-br:rgba(255,255,255,.07);
  --ok:#16A34A;--ok-l:#F0FDF4;--err:#DC2626;--err-l:#FEF2F2;--warn:#D97706;--warn-l:#FFFBEB;
  --t1:#1C1917;--t2:#44403C;--t3:#78716C;--t4:#A8A29E;--ti:#FAF9F7;
  --bd:#E8E2DA;--r:14px;--rsm:9px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);
  --sh2:0 4px 6px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.10);
  --sh3:0 8px 16px rgba(0,0,0,.06),0 24px 56px rgba(0,0,0,.14);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;}
/* APP SHELL */
.app{display:flex;height:100vh;overflow:hidden;}
/* SIDEBAR */
.sb{width:248px;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column;overflow-y:auto;}
.sb-top{padding:28px 22px 22px;border-bottom:1px solid var(--sb-br);margin-bottom:8px;}
.sb-logo{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;color:var(--ti);letter-spacing:-.5px;display:flex;align-items:center;gap:8px;}
.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0;}
.sb-sub{font-size:10.5px;font-weight:500;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.8px;margin-top:4px;}
.sb-nav{flex:1;padding:4px 12px;}
.sb-sec{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:rgba(255,255,255,.22);padding:16px 10px 6px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.48);font-size:13.5px;font-weight:500;margin-bottom:1px;user-select:none;position:relative;transition:background .12s,color .12s;}
.sb-item::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:0;border-radius:0 2px 2px 0;background:var(--brand);transition:height .15s;}
.sb-item:hover{background:var(--sb-hv);color:rgba(255,255,255,.8);}
.sb-item.on{background:var(--sb-ac);color:var(--ti);font-weight:600;}
.sb-item.on::before{height:20px;}
.sb-ico{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.sb-badge{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;min-width:20px;text-align:center;}
.sb-foot{padding:16px 12px 20px;border-top:1px solid var(--sb-br);}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;transition:background .12s;}
.sb-user:hover{background:var(--sb-hv);}
.sb-av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-.3px;}
.sb-uname{font-size:13px;font-weight:600;color:var(--ti);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.sb-urole{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px;}
/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--surf);border-bottom:1px solid var(--bd);padding:0 32px;height:64px;display:flex;align-items:center;flex-shrink:0;gap:16px;}
.tb-l{flex:1;}
.tb-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--t1);letter-spacing:-.2px;}
.tb-sub{font-size:12.5px;color:var(--t3);margin-top:1px;}
.tb-pill{background:var(--brand-l);color:var(--brand);font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:99px;white-space:nowrap;}
.content{padding:28px 32px;flex:1;}
/* CARDS */
.card{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);padding:24px;border:1px solid var(--bd);}
.card-t{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--t2);margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.sc{background:var(--surf);border-radius:var(--r);padding:20px 22px;border:1px solid var(--bd);box-shadow:var(--sh);border-top:3px solid transparent;}
.sc.cb{border-top-color:var(--brand);}.sc.cw{border-top-color:var(--warn);}
.sc.co{border-top-color:var(--ok);}.sc.cu{border-top-color:#3B82F6;}
.sc-n{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:800;color:var(--t1);letter-spacing:-1px;line-height:1;margin:12px 0 6px;}
.sc-l{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;}
.sc-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:8px;}
.sc-tag.ok{background:var(--ok-l);color:#15803D;}.sc-tag.w{background:var(--warn-l);color:#92400E;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
/* TABLE */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead tr{background:var(--surf2);}
th{text-align:left;padding:10px 16px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);border-bottom:1px solid var(--bd);white-space:nowrap;}
td{padding:12px 16px;border-bottom:1px solid var(--bd);color:var(--t2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surf2);}
/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.bdg::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.bdg.pendente{background:#FEF3C7;color:#92400E;}.bdg.pendente::before{background:var(--warn);}
.bdg.aprovado{background:var(--ok-l);color:#166534;}.bdg.aprovado::before{background:var(--ok);}
.bdg.entregue{background:#EFF6FF;color:#1E40AF;}.bdg.entregue::before{background:#3B82F6;}
.bdg.rejeitado{background:var(--err-l);color:#991B1B;}.bdg.rejeitado::before{background:var(--err);}
.tb-b{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.tb-Manha{background:#FEF9C3;color:#78350F;}.tb-Tarde{background:#E0F2FE;color:#0369A1;}
.tb-Noite{background:#EDE9FE;color:#4C1D95;}.tb-ADM{background:#F0FDF4;color:#14532D;}
.tb-JovemAprendiz{background:#FDF2F8;color:#86198F;}
/* SEARCH */
.srch{position:relative;margin-bottom:20px;}
.srch input{width:100%;height:40px;padding:0 14px 0 38px;border:1.5px solid var(--bd);border-radius:var(--rsm);font-size:13.5px;font-family:inherit;color:var(--t1);background:var(--surf);outline:none;transition:border-color .15s;}
.srch input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,70,31,.08);}
.srch input::placeholder{color:var(--t4);}
.srch-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t4);font-size:14px;pointer-events:none;line-height:1;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .14s;font-family:inherit;white-space:nowrap;letter-spacing:.1px;}
.bp{background:var(--brand);color:#fff;}.bp:hover{background:var(--brand-h);box-shadow:0 4px 12px rgba(232,70,31,.3);}
.bok{background:var(--ok);color:#fff;}.bok:hover{background:#15803D;}
.bno{background:var(--err);color:#fff;}.bno:hover{background:#B91C1C;}
.bgh{background:transparent;color:var(--t2);border:1.5px solid var(--bd);}.bgh:hover{background:var(--bg);border-color:var(--t4);}
.btn.sm{padding:5px 12px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.ico-btn{padding:6px 8px;border-radius:7px;background:transparent;border:1.5px solid var(--bd);cursor:pointer;font-size:13px;color:var(--t3);transition:all .14s;font-family:inherit;line-height:1;}
.ico-btn:hover{background:var(--bg);border-color:var(--t3);color:var(--t1);}
/* TABS */
.tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--bd);border-radius:10px;padding:3px;margin-bottom:22px;width:fit-content;}
.tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--t3);transition:all .14s;user-select:none;white-space:nowrap;}
.tab:hover{color:var(--t1);}.tab.on{background:var(--surf);color:var(--brand);box-shadow:var(--sh);}
/* TURNO GROUP */
.tg{margin-bottom:28px;}
.tg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.tg-cnt{font-size:11.5px;color:var(--t3);background:var(--surf);padding:2px 8px;border-radius:6px;border:1px solid var(--bd);}
/* STOCK */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.sc2{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);padding:18px 20px;}
.sc2.low-bdr{border-color:var(--warn);border-width:1.5px;}
.sc2.out-bdr{border-color:var(--err);border-width:1.5px;}
.sc2-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.sc2-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:7px;}
.sc2-meta{font-size:11px;color:var(--t4);margin-top:3px;}
.warn-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;margin-top:5px;}
.warn-tag.low{background:var(--warn-l);color:#92400E;}.warn-tag.out{background:var(--err-l);color:#991B1B;}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.pill{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:8px;min-width:46px;text-align:center;}
.pill-n{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;line-height:1;}
.pill-l{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:2px;}
.pill.ok{background:#F0FDF4;color:#15803D;}.pill.low{background:var(--warn-l);color:#92400E;}.pill.out{background:var(--err-l);color:#991B1B;}
/* QTY EDIT */
.qty-row{display:flex;flex-wrap:wrap;gap:12px;}
.qty-g{display:flex;flex-direction:column;align-items:center;gap:4px;}
.qty-g label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);font-weight:700;}
.qty-g input{width:64px;text-align:center;padding:7px 8px;border:1.5px solid var(--bd);border-radius:7px;font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;outline:none;}
.qty-g input:focus{border-color:var(--brand);}
/* FORMS */
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 13px;border-radius:var(--rsm);border:1.5px solid var(--bd);font-size:13.5px;font-family:inherit;color:var(--t1);background:var(--surf);outline:none;transition:border-color .14s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,70,31,.07);}
.fg input::placeholder,.fg textarea::placeholder{color:var(--t4);}
.fg textarea{min-height:72px;resize:vertical;}
.hint{font-size:11px;color:var(--t4);margin-top:4px;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
/* CHECKLIST */
.ck-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto;border:1.5px solid var(--bd);border-radius:var(--rsm);padding:8px;}
.ck-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background .1s;}
.ck-item:hover{background:var(--bg);}
.ck-item input[type="checkbox"]{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;flex-shrink:0;}
.ck-lbl{font-size:13px;color:var(--t2);user-select:none;}
/* UNIFORM MULTI-SELECT */
.ut-block{margin-bottom:8px;border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;}
.ut-head{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);}
.ut-label{flex:1;font-size:13px;font-weight:600;color:var(--t1);}
.ut-add{background:none;border:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--brand);padding:2px 8px;border-radius:5px;}
.ut-add:hover{background:var(--brand-l);}
.ut-entry{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--bd);background:var(--surf);}
.ut-entry select,.ut-entry input{padding:5px 9px;border-radius:6px;border:1.5px solid var(--bd);font-family:inherit;font-size:13px;font-weight:600;outline:none;background:var(--surf);color:var(--t1);}
.ut-entry select:focus,.ut-entry input:focus{border-color:var(--brand);}
.ut-entry input[type="number"]{width:64px;text-align:center;}
.ut-lbl{font-size:11.5px;color:var(--t3);font-weight:500;white-space:nowrap;}
.ut-del{background:none;border:none;cursor:pointer;color:var(--t4);font-size:16px;line-height:1;padding:2px;border-radius:4px;transition:color .12s;}
.ut-del:hover{color:var(--err);}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(22,17,12,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.mo{background:var(--surf);border-radius:18px;box-shadow:var(--sh3);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--bd);}
.mo.wide{max-width:680px;}
.mo-hd{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 20px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.mo-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--t1);}
.mo-x{background:var(--bg);border:none;font-size:16px;cursor:pointer;color:var(--t3);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:background .12s;}
.mo-x:hover{background:var(--bd);color:var(--t1);}
.mo-body{padding:22px 26px;overflow-y:auto;flex:1;}
.mo-foot{padding:14px 26px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--bd);flex-shrink:0;}
.mo-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t4);margin:18px 0 8px;}
.divider{height:1px;background:var(--bd);margin:16px 0;}
/* MISC */
.empty{text-align:center;padding:48px 24px;color:var(--t4);}
.empty .i{font-size:36px;margin-bottom:12px;opacity:.7;}
.empty p{font-size:14px;font-weight:500;}
.aw{border-radius:var(--rsm);padding:10px 14px;margin-bottom:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;border-left:3px solid var(--warn);background:var(--warn-l);color:#92400E;}
.flash{border-radius:9px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.flash.e{background:var(--err-l);color:#B91C1C;}.flash.o{background:var(--ok-l);color:#166534;}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--bd);padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:500;color:var(--t2);margin:2px;white-space:nowrap;}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
.pt{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--t1);}
/* UNIFORM CARDS (employee) */
.ug{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.uc{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);padding:22px;position:relative;overflow:hidden;}
.uc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand);}
.uc-ico{font-size:32px;margin-bottom:12px;display:block;}
.uc-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--t1);margin-bottom:8px;}
.uc-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;margin:2px 2px 0 0;}
.uc-tag.normal{background:var(--brand-l);color:var(--brand);}
.uc-tag.qty{background:var(--brand);color:#fff;}
/* LOGIN */
.lw{min-height:100vh;display:flex;}
.ll{width:44%;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column;justify-content:space-between;padding:48px 52px;position:relative;overflow:hidden;}
.ll::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(232,70,31,.18) 0%,transparent 70%);bottom:-80px;right:-80px;pointer-events:none;}
.ll::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(232,70,31,.12) 0%,transparent 70%);top:40px;right:20px;pointer-events:none;}
.l-brand{position:relative;z-index:1;}
.l-mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:48px;}
.l-mdot{width:10px;height:10px;border-radius:50%;background:var(--brand);}
.l-mname{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.3px;}
.l-hero{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:800;color:#fff;letter-spacing:-1.5px;line-height:1.1;}
.l-hero em{font-style:normal;color:var(--brand);}
.l-desc{font-size:15px;color:rgba(255,255,255,.42);margin-top:20px;line-height:1.65;max-width:280px;}
.l-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:36px;}
.l-pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:6px 14px;font-size:12.5px;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:6px;font-weight:500;}
.l-ft{font-size:11.5px;color:rgba(255,255,255,.2);font-weight:500;position:relative;z-index:1;}
.lr{flex:1;background:var(--surf);display:flex;flex-direction:column;justify-content:center;padding:52px 56px;}
.l-ftitle{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;color:var(--t1);letter-spacing:-.4px;margin-bottom:6px;}
.l-fsub{font-size:14px;color:var(--t3);margin-bottom:32px;line-height:1.5;min-height:42px;}
.lf{margin-bottom:14px;}
.lf label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.lf-in{position:relative;}
.lf-in input{width:100%;height:50px;padding:0 48px 0 16px;border:1.5px solid var(--bd);border-radius:11px;font-size:14.5px;font-family:inherit;color:var(--t1);background:var(--surf);outline:none;transition:border-color .14s,box-shadow .14s;}
.lf-in input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,70,31,.1);}
.lf-in input::placeholder{color:var(--t4);}
.l-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--t4);font-size:16px;padding:2px;line-height:1;transition:color .12s;}
.l-eye:hover{color:var(--t1);}
.l-btn{width:100%;height:52px;border-radius:11px;background:var(--brand);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;letter-spacing:.2px;transition:background .14s,box-shadow .14s;margin-top:6px;}

// Converte o "usuário" digitado num identificador interno para o Supabase Auth.
// O usuário nunca precisa de e-mail: "joao.silva" vira "joao.silva@gouniform.local".
// Se digitar algo com "@" (um e-mail real), é aceito como está — mas não é exigido.
function userToEmail(u){
  u = (u||'').trim();
  if (u.includes('@')) return u.toLowerCase();
  const base = u.normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,'');
  return base ? base + '@gouniform.local' : '';
}
function traduzErro(m){ m = m || '';
  if (/Invalid login credentials/i.test(m)) return 'Usuário ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Cadastro ainda não liberado. Fale com o administrador.';
  if (/already registered|already been registered|User already registered/i.test(m)) return 'Esse usuário já existe. Tente outro.';
  if (/Password should be at least|weak/i.test(m)) return 'A senha é muito curta (mínimo 6 caracteres).';
  if (/rate limit|too many|For security/i.test(m)) return 'Muitas tentativas. Aguarde um instante e tente de novo.';
  if (/Unable to validate email|invalid format|valid email/i.test(m)) return 'Usuário inválido. Use letras e números (sem espaços).';
  return m;
}

async function loadStock(){
  const {data,error} = await sb.from('estoque').select('*').order('nome');

  S.unifs=[]; S.pap=[]; S.kit=[]; S.farm=[]; S.seg=[];
  for(const r of data){
    const arr = CAT2ARR[r.categoria]; if(!arr) continue;
    S[arr].push({id:r.id,name:r.nome,icon:r.icon,limite:r.limite,minimo:r.minimo,stock:r.stock||{}});

}

function subscribeRealtime(){
  if (_rtChannel) return;
  _rtChannel = sb.channel('gu-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'estoque'},      rtRefresh)

function backupData() {
  try {
    const data = {
      exportedAt: new Date().toLocaleString('pt-BR'),
      version: 'GoUniform v1',
      emps:  S.emps,
      unifs: S.unifs,
      pap:   S.pap,
      kit:   S.kit,
      farm:  S.farm,
      seg:   S.seg,
      movs:  S.movs,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const date = new Date().toISOString().slice(0,10);
    a.href     = url;
    a.download = 'gouniform-backup-' + date + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Erro ao gerar backup: ' + e.message);
  }
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  if (!inp) return;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
}

async function doLogin() {
  const user = (document.getElementById('l-user')?.value || '').trim();
  const pwd  = document.getElementById('l-pwd')?.value || '';
  S.modalForm = {user, pwd};
  S.modalErr = ''; S.loginNotice = '';
  if (!user || !pwd) { S.modalErr = 'Informe usuário e senha.'; render(); return; }
  const email = userToEmail(user);
  if (!email) { S.modalErr = 'Usuário inválido.'; render(); return; }
  S.busy = true; render();
  const {error} = await sb.auth.signInWithPassword({email, password:pwd});
  S.busy = false;
  if (error) { S.modalErr = traduzErro(error.message); render(); return; }
  await enterApp();
}

function getDashboard() {
  const allItems = [...S.unifs,...S.pap,...S.kit,...S.farm,...S.seg];
  const alerts = allItems.flatMap(item => {
    const min = item.minimo||0;
    return Object.entries(item.stock||{}).flatMap(([sz,qty]) => {
      const szS = sz!=='Unid'?' '+sz:'';
      if (qty===0) return [{name:item.name+szS,label:'Sem estoque',out:true}];
      if (min>0&&qty<=min) return [{name:item.name+szS,label:`${qty} un. (mínimo: ${min})`,out:false}];
      return [];
    });
  }).slice(0,8);
  const alertsHTML = alerts.length===0
    ? `<p style="color:var(--t3);font-size:13px;font-weight:500">✅ Todos os itens dentro do mínimo.</p>`
    : alerts.map(a=>`<div class="aw">${a.out?'🔴':'🟡'} <strong>${esc(a.name)}</strong> — ${esc(a.label)}</div>`).join('');

  const hojeISO = new Date().toISOString().slice(0,10);
  const doDia = S.movs.filter(m=>m.ts && m.ts.slice(0,10)===hojeISO);
  const entradasHoje = doDia.filter(m=>m.tipo==='entrada').reduce((n,m)=>n+m.qtd,0);
  const saidasHoje   = doDia.filter(m=>m.tipo==='saida').reduce((n,m)=>n+m.qtd,0);
  const totalUn = allItems.reduce((n,it)=>n+Object.values(it.stock||{}).reduce((a,b)=>a+b,0),0);

  const movRows = S.movs.slice(0,7).map(m=>`<tr>
    <td style="white-space:nowrap;font-size:12px;color:var(--t4)">${esc(m.data)}</td>
    <td>${movBadge(m.tipo)}</td>
    <td><strong style="color:var(--t1)">${esc(m.item)}</strong> <span style="color:var(--t4);font-size:12px">${esc(m.tam)}</span></td>
    <td style="white-space:nowrap"><strong>${m.tipo==='entrada'?'+':'−'}${m.qtd}</strong></td>
  </tr>`).join('');
  const movVazio = S.movs.length===0
    ? `<div class="empty" style="padding:28px"><div class="i">🔄</div><p>Nenhuma movimentação registrada ainda.</p></div>` : '';

  return `<div class="stats">
    <div class="sc co"><div class="sc-l">Entradas hoje</div><div class="sc-n">${entradasHoje}</div><div class="sc-tag ok">un. recebidas</div></div>
    <div class="sc cw"><div class="sc-l">Saídas hoje</div><div class="sc-n">${saidasHoje}</div><div class="sc-tag ${saidasHoje>0?'w':'ok'}">un. retiradas</div></div>
    <div class="sc cu"><div class="sc-l">Em estoque</div><div class="sc-n">${totalUn}</div><div class="sc-tag ok">${allItems.length} itens</div></div>
  </div>
  <div class="two">
    <div class="card" style="padding:0">
      <div style="padding:22px 24px 6px"><div class="card-t" style="margin:0">Últimas movimentações</div></div>
      ${movVazio || `<div class="tw"><table><tbody>${movRows}</tbody></table></div>`}
    </div>
    <div class="card"><div class="card-t">Alertas de Estoque</div>${alertsHTML}</div>
  </div>`;

  return tipo==='entrada'

    <div class="sc cw"><div class="sc-l">Abaixo do mínimo</div><div class="sc-n">${geral.baixo}</div><div class="sc-tag ${geral.baixo>0?'w':'ok'}">${geral.baixo>0?'Repor':'Em dia'}</div></div>
    <div class="sc co"><div class="sc-l">Sem estoque</div><div class="sc-n">${geral.zerado}</div><div class="sc-tag ${geral.zerado>0?'w':'ok'}">${geral.zerado>0?'Atenção':'Nenhum'}</div></div>

function exportStockCSV() {
  try {
    const cats = [['Uniformes',S.unifs],['Papelaria',S.pap],['Kit Conforto',S.kit],['Farmácia',S.farm],['Segurança',S.seg]];
    const linhas = [['Categoria','Item','Tamanho','Quantidade','Mínimo','Limite'].join(';')];
    for (const [nome,arr] of cats)
      for (const it of arr)
        for (const [tam,qtd] of Object.entries(it.stock||{}))
          linhas.push([nome, it.name, tam, qtd, it.minimo||0, it.limite||0].join(';'));
    // BOM para o Excel abrir os acentos corretamente
    const blob = new Blob(['﻿'+linhas.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gouniform-estoque-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) { alert('Erro ao exportar: ' + e.message); }
}

function closeModal() {
  S.modal = null; S.modalForm = {}; S.modalErr = '';
  S.delStockConfirm = false;
  render();
}

function getModal() {
  const m = S.modal;
  if (m==='mov')       return getMovModal();
  if (m==='editStock') return getEditStockModal();
  if (m==='addStock')  return getAddStockModal();
  return '';
}

function modalShell(title, body, footer, wide=false) {
  return `<div class="ov" onclick="if(event.target===this)closeModal()">
    <div class="mo${wide?' wide':''}">
      <div class="mo-hd">
        <div class="mo-title">${esc(title)}</div>
        <button class="mo-x" onclick="closeModal()">✕</button>

      <div class="mo-foot">${footer}</div>

}

// ─── ENTRADA / SAÍDA ──────────────────────────────────────────────────────────
const MOTIVOS = {
  entrada: ['Compra','Devolução','Ajuste de inventário','Transferência','Outro'],
  saida:   ['Entrega a funcionário','Perda / avaria','Ajuste de inventário','Transferência','Outro'],
};

function openMov(itemId, tab, tipo) {
  const item = getItemList(tab).find(x=>x.id===itemId);
  if (!item) return;
  const tams = Object.keys(item.stock||{});
  S.modal = 'mov';
  S.modalForm = {itemId, _tab:tab, tipo, nome:item.name, icon:item.icon,
                 tam:tams[0]||'', qtd:'', motivo:MOTIVOS[tipo][0], obs:''};
  S.modalErr = '';
  render();
}

function getMovModal() {
  const mf = S.modalForm;
  const item = getItemList(mf._tab).find(x=>x.id===mf.itemId) || {stock:{}};
  const entrada = mf.tipo === 'entrada';
  const saldo = Number(item.stock?.[mf.tam] ?? 0);
  const qtd = parseInt(mf.qtd)||0;
  const novo = entrada ? saldo + qtd : saldo - qtd;
  const err = S.modalErr ? `<div class="flash e">⚠️ ${esc(S.modalErr)}</div>` : '';
  const tamOpts = Object.entries(item.stock||{})
    .map(([t,q])=>`<option value="${esc(t)}"${mf.tam===t?' selected':''}>${esc(t)} — ${q} un.</option>`).join('');
  const motivoOpts = MOTIVOS[mf.tipo]
    .map(m=>`<option value="${esc(m)}"${mf.motivo===m?' selected':''}>${esc(m)}</option>`).join('');
  const previa = qtd>0 ? `
    <div class="flash ${novo<0?'e':'o'}" style="margin:2px 0 0">
      ${novo<0 ? `⚠️ Saldo insuficiente — há apenas ${saldo} em ${esc(mf.tam)}.`
               : `Saldo de <strong>${esc(mf.tam)}</strong>: ${saldo} → <strong>${novo}</strong> un.`}
    </div>` : '';
  const body = `${err}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span style="font-size:26px">${item.icon||'📦'}</span>
      <div>
        <div style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700">${esc(mf.nome)}</div>
        <div style="font-size:12px;color:var(--t3)">${entrada?'Registrar entrada no estoque':'Registrar saída do estoque'}</div>
      </div>
    </div>
    <div class="fr2">
      <div class="fg"><label>Tamanho / variação</label>
        <select onchange="S.modalForm.tam=this.value;render()">${tamOpts}</select>
      </div>
      <div class="fg"><label>Quantidade</label>
        <input type="number" min="1" placeholder="0" value="${esc(mf.qtd||'')}"
               oninput="S.modalForm.qtd=this.value;render()">
      </div>
    </div>
    ${previa}
    <div class="fg" style="margin-top:14px"><label>Motivo</label>
      <select onchange="S.modalForm.motivo=this.value">${motivoOpts}</select>
    </div>
    <div class="fg"><label>Observação (opcional)</label>
      <input placeholder="Ex: nota fiscal 1234, nome de quem retirou..." value="${esc(mf.obs||'')}"
             oninput="S.modalForm.obs=this.value">
    </div>`;
  const podeSalvar = qtd>0 && novo>=0 && !S.busy;
  const footer = `<button class="btn bgh" onclick="closeModal()">Cancelar</button>
    <button class="btn ${entrada?'bok':'bno'}" onclick="salvarMov()"${podeSalvar?'':' disabled'}>
      ${S.busy ? 'Salvando…' : (entrada ? '↓ Confirmar entrada' : '↑ Confirmar saída')}
    </button>`;
  return modalShell(entrada?'Entrada de estoque':'Saída de estoque', body, footer);
}

async function salvarMov() {
  const mf = S.modalForm;
  const qtd = parseInt(mf.qtd)||0;
  if (!mf.tam) { S.modalErr='Selecione o tamanho.'; render(); return; }
  if (qtd<=0)  { S.modalErr='Informe uma quantidade maior que zero.'; render(); return; }
  const motivo = [mf.motivo, (mf.obs||'').trim()].filter(Boolean).join(' — ');
  S.busy = true; S.modalErr=''; render();
  const {error} = await sb.rpc('registrar_movimentacao', {
    p_item_id: mf.itemId, p_tamanho: mf.tam, p_tipo: mf.tipo, p_qtd: qtd, p_motivo: motivo
  });
  S.busy = false;
  if (error) { S.modalErr = traduzErro(error.message); render(); return; }
  await loadStock(); await loadMovs();
  closeModal();
}

    <td><strong style="color:var(--t1)">${esc(m.item)}</strong></td>
    <td><span class="chip">${esc(m.tam)}</span></td>
    <td style="white-space:nowrap"><strong style="font-family:'Space Grotesk',sans-serif;font-size:15px;color:${m.tipo==='entrada'?'var(--ok)':'var(--err)'}">${m.tipo==='entrada'?'+':'−'}${m.qtd}</strong></td>
    <td style="white-space:nowrap;color:var(--t3)">${m.saldo==null?'—':m.saldo+' un.'}</td>
    <td style="font-size:12.5px;color:var(--t3)">${esc(m.motivo||'—')}</td>
    <td style="font-size:12.5px;color:var(--t3);white-space:nowrap">${esc(m.usuario)}</td>
  </tr>`).join('');
  return `<div class="ph"><div class="pt">Histórico de movimentações</div>
    <button class="btn bgh sm" onclick="exportMovsCSV()">📄 Exportar CSV</button>
  </div>
  <div class="tabs">${tabs}</div>
  <div class="card" style="padding:0"><div class="tw"><table>
    <thead><tr><th>Data</th><th>Tipo</th><th>Item</th><th>Tam.</th><th>Qtd.</th><th>Saldo</th><th>Motivo</th><th>Por</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}

function exportMovsCSV() {
  try {
    const linhas = [['Data','Tipo','Item','Tamanho','Quantidade','Saldo depois','Motivo','Usuário'].join(';')];
    for (const m of S.movs)
      linhas.push([m.data, m.tipo, m.item, m.tam, m.qtd, m.saldo==null?'':m.saldo, m.motivo, m.usuario].join(';'));
    const blob = new Blob(['﻿'+linhas.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gouniform-movimentacoes-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) { alert('Erro ao exportar: ' + e.message); }
}

// ─── STOCK MODALS ─────────────────────────────────────────────────────────────
function getItemList(tab) { return tab==='u'?S.unifs:tab==='p'?S.pap:tab==='k'?S.kit:tab==='f'?S.farm:S.seg; }
function setItemList(tab,list) { if(tab==='u') S.unifs=list; else if(tab==='p') S.pap=list; else if(tab==='k') S.kit=list; else if(tab==='f') S.farm=list; else S.seg=list; }

function openEditStock(id, tab) {
  const item = getItemList(tab).find(x=>x.id===id);
  if (!item) return;
  S.modal='editStock'; S.modalForm={...item,_tab:tab,stock:{...item.stock}}; S.modalErr=''; render();
}
function getEditStockModal() {
  const mf = S.modalForm;
  const stockFields = Object.entries(mf.stock||{}).map(([sz,qty])=>`
    <div class="qty-g">
      <label>${esc(sz)}</label>
      <input type="number" min="0" value="${qty}" onchange="setStockQty('${esc(sz)}',this.value)">
    </div>`).join('');
  const body = `<div style="font-size:11px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Quantidades por tamanho</div>
    <div class="qty-row" style="margin-bottom:20px">${stockFields}</div>
    <div class="fr2">
      <div class="fg"><label>Quantidade mínima (alerta)</label>
        <input type="number" min="0" placeholder="Ex: 5" value="${mf.minimo||0}" onchange="setStockMeta('minimo',this.value)">
        <div class="hint">Alerta quando qualquer tamanho atinge esse limite.</div>
      </div>
      <div class="fg"><label>Quantidade limite (máximo)</label>
        <input type="number" min="0" placeholder="Ex: 50" value="${mf.limite||0}" onchange="setStockMeta('limite',this.value)">
      </div>
    </div>`;
  let footer;
  if (S.delStockConfirm) {
    footer = `<div style="display:flex;justify-content:space-between;align-items:center;width:100%">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:13px;font-weight:600;color:var(--err)">Confirmar exclusão?</span>
        <button class="btn bno" onclick="deleteStockItem()">Sim, excluir</button>
        <button class="btn bgh" onclick="S.delStockConfirm=false;render()">Não</button>
      </div><div></div></div>`;
  } else {
    footer = `<div style="display:flex;justify-content:space-between;align-items:center;width:100%">
      <button class="btn bno" onclick="S.delStockConfirm=true;render()">🗑️ Excluir item</button>
      <div style="display:flex;gap:10px">
        <button class="btn bgh" onclick="closeModal()">Cancelar</button>
        <button class="btn bp" onclick="saveEditStock()">Salvar</button>
      </div></div>`;
  }
  return modalShell(`Editar — ${esc(mf.name)}`, body, footer);
}
function setStockQty(sz, v) { S.modalForm.stock[sz] = Math.max(0,parseInt(v)||0); }
function setStockMeta(k, v) { S.modalForm[k] = Math.max(0,parseInt(v)||0); }
async function saveEditStock() {
  const mf = S.modalForm;
  const {error} = await sb.from('estoque').update({
    stock:mf.stock, minimo:mf.minimo, limite:mf.limite
  }).eq('id', mf.id);
  if (error) { alert('Erro ao salvar: ' + traduzErro(error.message)); return; }
  await loadStock(); closeModal();
}

function openAddStock(tab) { S.modal='addStock'; S.modalForm={_tab:tab,name:'',icon:'',limite:'',minimo:'',sizes:''}; S.modalErr=''; render(); }
function getAddStockModal() {
  const mf = S.modalForm;
  const label = mf._tab==='u'?'Uniformes':mf._tab==='p'?'Papelaria':'Kit Conforto';
  const err = S.modalErr?`<div class="flash e">⚠️ ${esc(S.modalErr)}</div>`:'';
  const body = `${err}
    <div class="fr2">
      <div class="fg"><label>Nome</label><input placeholder="Ex: Caneta" value="${esc(mf.name||'')}" oninput="S.modalForm.name=this.value"></div>
      <div class="fg"><label>Emoji</label><input placeholder="Ex: 🖊️" value="${esc(mf.icon||'')}" oninput="S.modalForm.icon=this.value"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label>Limite máximo</label><input type="number" min="0" placeholder="Ex: 50" value="${mf.limite||''}" oninput="S.modalForm.limite=this.value"></div>
      <div class="fg"><label>Quantidade mínima</label><input type="number" min="0" placeholder="Ex: 5" value="${mf.minimo||''}" oninput="S.modalForm.minimo=this.value"></div>
    </div>
    <div class="fg">
      <label>Tamanhos e quantidades iniciais</label>
      <input placeholder="Ex: P:10, M:8, G:5  ou  Unid:20" value="${esc(mf.sizes||'')}" oninput="S.modalForm.sizes=this.value">
      <div class="hint">Formato: Tamanho:Quantidade separados por vírgula.</div>
    </div>`;
  const footer = `<button class="btn bgh" onclick="closeModal()">Cancelar</button><button class="btn bp" onclick="addStockItem()">Adicionar</button>`;
  return modalShell(`Novo item — ${label}`, body, footer);
}
async function deleteStockItem() {
  const mf = S.modalForm;
  const {error} = await sb.from('estoque').delete().eq('id', mf.id);
  if (error) { alert('Erro ao excluir: ' + traduzErro(error.message)); return; }
  S.delStockConfirm = false;
  await loadStock(); closeModal();
}

async function addStockItem() {
  const mf = S.modalForm;
  if (!mf.name?.trim()) { S.modalErr='Informe o nome.'; render(); return; }
  const stock = {};
  (mf.sizes||'Unid').split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{
    const parts = s.includes(':') ? s.split(':') : [s,'0'];
    stock[parts[0].trim()] = parseInt(parts[1])||0;
  });
  const item = {id:'item_'+Date.now(), categoria:TAB2CAT[mf._tab], nome:mf.name.trim(),
    icon:(mf.icon||'').trim()||'📦', limite:parseInt(mf.limite)||0, minimo:parseInt(mf.minimo)||0, stock};
  const {error} = await sb.from('estoque').insert(item);
  if (error) { S.modalErr = traduzErro(error.message); render(); return; }
  await loadStock(); closeModal();
}

// ─── EVENT ATTACHMENT ─────────────────────────────────────────────────────────
// Guarda o que foi digitado no login sem re-renderizar (não perde o foco).
function attachEvents() {
  const userInp = document.getElementById('l-user');
  const pwdInp  = document.getElementById('l-pwd');

  if (userInp) {
    userInp.addEventListener('input', e => { S.modalForm.user = e.target.value; });
    userInp.addEventListener('keydown', e => { if (e.key==='Enter') { document.getElementById('l-pwd')?.focus(); } });
  }
  if (pwdInp) {
    pwdInp.addEventListener('input', e => { S.modalForm.pwd = e.target.value; });
    pwdInp.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
S.modalForm = {};

function loadingHTML(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F4F1;font-family:'Inter',sans-serif;">
    <div style="text-align:center">
      <div style="font-size:32px;margin-bottom:12px">⏳</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#1C1917">Carregando GoUniform…</div>
      <div style="font-size:13px;color:#78716C;margin-top:6px">Conectando ao servidor</div>
    </div>
  </div>`;
}

// Recarrega dados do servidor — mas nunca no meio de uma edição (modal aberto),
// para não sobrescrever o que o usuário está digitando.
async function refreshData(){
  if (!S.auth || S.modal) return;
  await loadAll();
  render();
}

(async () => {
  document.getElementById('app').innerHTML = loadingHTML();
  const {data:{session}} = await sb.auth.getSession();
  if (session) { await enterApp(); }
  else { S.auth = null; render(); }

  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') { S.auth = null; render(); }
  });

  setInterval(refreshData, 60000);
  window.addEventListener('focus', refreshData);
})();
</script>
